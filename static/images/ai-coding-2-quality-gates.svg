<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Generated code passes through engineering quality gates</title>
  <desc id="desc">A bright stream of code is examined at design, review, test and deploy gates before becoming a reliable product.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071a28"/><stop offset="1" stop-color="#112e39"/></linearGradient>
    <linearGradient id="flow" x2="1"><stop stop-color="#fb7185"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path fill="url(#bg)" d="M0 0h1600v900H0z"/>
  <g opacity=".18" stroke="#67e8f9"><path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g>
  <path d="M70 478H1525" stroke="url(#flow)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#f8fafc" font-family="ui-monospace,monospace" font-size="18" opacity=".6">
    <text x="100" y="420">const feature = await build();</text><text x="260" y="534">if (contract) { review(diff); }</text>
    <text x="890" y="422">expect(result).toMatch(intent)</text><text x="1260" y="535">ship(verified);</text>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(290 478)"><circle r="74" fill="#102c38" stroke="#fb7185" stroke-width="5"/><path d="M-29-27h58v54h-58zM-17-13h34M-17 0h34M-17 13h21" fill="none" stroke="#ffe4e6" stroke-width="5" stroke-linecap="round"/><text y="126" fill="#fff" font-size="22" font-weight="700">DESIGN</text><text y="155" fill="#a5f3fc" font-size="15">intent &amp; boundaries</text></g>
    <g transform="translate(650 478)"><circle r="74" fill="#102c38" stroke="#fbbf24" stroke-width="5"/><path d="m-34 2 22 22 47-51" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text y="126" fill="#fff" font-size="22" font-weight="700">REVIEW</text><text y="155" fill="#a5f3fc" font-size="15">diff &amp; assumptions</text></g>
    <g transform="translate(1010 478)"><circle r="74" fill="#102c38" stroke="#2dd4bf" stroke-width="5"/><path d="M-31-30h62v60h-62zM-18-14h36M-18 0h29M-18 14h21" fill="none" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round"/><text y="126" fill="#fff" font-size="22" font-weight="700">TEST</text><text y="155" fill="#a5f3fc" font-size="15">behaviour &amp; failure</text></g>
    <g transform="translate(1370 478)"><circle r="74" fill="#102c38" stroke="#5eead4" stroke-width="5"/><path d="M-31 10h62M-21 10V-8l21-19 21 19v18M-10 10v-15h20v15" fill="none" stroke="#ccfbf1" stroke-width="5" stroke-linejoin="round"/><text y="126" fill="#fff" font-size="22" font-weight="700">OWN</text><text y="155" fill="#a5f3fc" font-size="15">operate &amp; maintain</text></g>
  </g>
  <text x="80" y="112" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="40" font-weight="650">FAST GENERATION. HUMAN ACCOUNTABILITY.</text>
  <text x="82" y="151" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="19" letter-spacing="4">THE CODE IS ONLY ONE STEP IN THE PIPELINE</text>
</svg>
