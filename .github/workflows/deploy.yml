name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# One deploy at a time, in push order. Without this, two merges close together
# build in parallel and whichever finishes last overwrites gh-pages, even if it
# built the older commit. Queued runs are never cancelled mid-deploy; a newer
# push replaces an older one that is still waiting, which is fine because the
# newer commit contains it.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
